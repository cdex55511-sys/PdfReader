
name: Build PDF Reader APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PdfReader.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          unzip -q PdfReader.zip -d .
          ls -la
          test -f PdfReader/gradlew

      - name: Grant Gradle permission
        run: chmod +x PdfReader/gradlew

      - name: Build Debug APK
        working-directory: PdfReader
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PdfReader-APK
          path: PdfReader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
