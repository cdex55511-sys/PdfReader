
name: Build PDF Reader APK

'on':
  workflow_dispatch:
  push:
    paths:
      - 'PdfReader-fixed-v2.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Verify ZIP file
        run: |
          ls -lah
          test -f PdfReader-fixed-v2.zip

      - name: Extract ZIP
        id: extract
        run: |
          set -e

          mkdir -p extracted
          unzip -q PdfReader-fixed-v2.zip -d extracted

          SETTINGS_FILE=$(find "$PWD/extracted" -type f -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Increase Gradle network timeout
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          FILE="gradle/wrapper/gradle-wrapper.properties"

          if grep -q '^networkTimeout=' "$FILE"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$FILE"
          else
            echo 'networkTimeout=120000' >> "$FILE"
          fi

          cat "$FILE"

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('PdfReader-fixed-v2.zip') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Download Gradle distribution with retries
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          chmod +x gradlew

          for attempt in 1 2 3; do
            echo "Gradle download attempt $attempt of 3"

            if ./gradlew --version; then
              echo "Gradle distribution ready"
              exit 0
            fi

            echo "Download failed. Retrying in 15 seconds..."
            sleep 15
          done

          echo "ERROR: Gradle download failed after 3 attempts"
          exit 1

      - name: Build Debug APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PdfReader-debug-APK
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
